# ============================================================
# docker-compose.yml (tiêu chí 2): agent + redis
#   docker compose up --build
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
    env_file:
      - path: .env
        required: false
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  redis-data:

# ============================================================
# railway.toml (tiêu chí 12) — deploy Railway
#   Deploy: railway up
#   App lắng nghe theo biến PORT do Railway cấp (xử lý trong CMD của Dockerfile).
# ============================================================

[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"

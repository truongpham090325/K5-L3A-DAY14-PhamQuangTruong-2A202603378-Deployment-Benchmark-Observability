# ============================================================
# render.yaml (tiêu chí 12) — deploy Render (Blueprint)
#   Secret (AGENT_API_KEY) dùng generateValue, KHÔNG ghi thẳng giá trị.
#   Redis được khai báo riêng (type: redis) và nối vào agent qua fromService.
# ============================================================
services:
  - type: web
    name: production-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"

  # Redis managed — dùng cho rate limiting + cost guard (stateless)
  - type: redis
    name: agent-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
